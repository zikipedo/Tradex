# Intégration continue TradX : à chaque push et pull request.
# 1. compilation sans avertissement, 2. tous les tests (unitaires + intégration PostgreSQL via Testcontainers),
# 3. analyse des dépendances vulnérables, 4. analyse SonarCloud (si le secret SONAR_TOKEN est configuré).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Front web (React + Vite) : types, lint, tests, build et dépendances vulnérables.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation reproductible
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Dépendances vulnérables (échec à partir du niveau « high »)
        run: npm audit --audit-level=high

  # Image de production : vérifie à chaque push que le Dockerfile se construit toujours (sans la publier).
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construction de l'image de production
        run: docker build -t tradx:ci .

      - name: L'image démarre et sert le site
        run: |
          docker run --rm --entrypoint sh tradx:ci -c "test -f /app/wwwroot/index.html && test -f /app/libSkiaSharp.so && test ! -d /app/runtimes"

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restauration des outils et paquets
        run: |
          dotnet tool restore
          dotnet restore

      - name: Compilation (avertissements = erreurs)
        run: dotnet build --no-restore -c Release

      - name: Tests unitaires et d'intégration avec couverture
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory TestResults

      - name: Dépendances vulnérables (échec si une vulnérabilité est trouvée)
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulnerable.json
          cat vulnerable.json
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length' vulnerable.json)
          echo "Paquets vulnérables : $count"
          test "$count" -eq 0

      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**"
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
